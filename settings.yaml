# Valores por defecto de la aplicación. Las variables de entorno tienen prioridad.
# Aquí NUNCA van claves secretas.
llm_provider: fake
llm_model: claude-haiku-4-5-20251001
top_k: 3
# PROVISIONAL: se calibra con datos reales en T19.
umbral_recuperacion: 0.3
umbral_reembolso: 500
timeout_llm_s: 30
timeout_tool_s: 5
# Chunking: none | fixed | recursive | auto (auto = none si el documento es corto).
chunk_strategy: auto
# Umbral de documento corto en caracteres (los 5 docs actuales miden ~200-330).
chunk_umbral_corto: 1000
chunk_tamano: 500
chunk_solape: 50
