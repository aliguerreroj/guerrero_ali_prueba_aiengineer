# Valores por defecto de la aplicación. Las variables de entorno tienen prioridad.
# Aquí NUNCA van claves secretas.
# Proveedor del LLM: fake | anthropic | azure (claves y endpoint van en .env, nunca aquí).
llm_provider: fake
llm_model: claude-haiku-4-5-20251001
llm_max_tokens: 1024
# Orquestador (T14): máximo de llamadas al LLM por turno (bucle de tool use), >= 1.
max_iteraciones_llm: 5
# Clasificador de intención (T15): capa LLM tras las reglas deterministas (solo puede agregar escalamientos).
usar_clasificador_llm: true
max_tokens_clasificador: 96
# Trazas (T17): precios en USD por millón de tokens del modelo claude-haiku-4-5-20251001.
# Fuente: precios de Claude Haiku 4.5 en https://platform.claude.com/docs/en/about-claude/pricing
# (tomados de la tabla de modelos de la skill claude-api, caché 2026-09-25; NO verificados en vivo
# contra la página porque el acceso web falló: el humano debe confirmarlos).
precio_entrada_por_millon: 1.00
precio_salida_por_millon: 5.00
azure_openai_api_version: "2024-10-21"  # entre comillas: si no, YAML lo lee como fecha
top_k: 3
# Relevancia sobre puntajes ORIGINALES (no sobre RRF): chunk relevante si BM25 > umbral_bm25
# O coseno > umbral_semantico. Ambos son PROVISIONALES hasta T19 (ver ADR-004).
umbral_bm25: 0.5
umbral_semantico: 0.3
umbral_reembolso: 500
timeout_llm_s: 30
timeout_tool_s: 5
# Reintentos del cliente LLM (los hace el SDK con su backoff; T12 los pasa como max_retries). 0-5.
max_reintentos_llm: 2
# Chunking: none | fixed | recursive | auto (auto = none si el documento es corto).
chunk_strategy: auto
# Umbral de documento corto en caracteres (los 5 docs actuales miden ~200-330).
chunk_umbral_corto: 1000
chunk_tamano: 500
chunk_solape: 50
# Modelo de embeddings de fastembed (384 dim, ONNX, multilingue).
embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
