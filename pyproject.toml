[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiendahogar-agent"
version = "0.1.0"
description = "Agente de soporte al cliente de TiendaHogar (RAG + tool de pedidos + guardrails)"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.2", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["harness/context"]
