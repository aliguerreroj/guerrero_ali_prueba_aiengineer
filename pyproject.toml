[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiendahogar-agent"
version = "0.1.0"
description = "Agente de soporte al cliente de TiendaHogar (RAG + tool de pedidos + guardrails)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=2.2",
    "fastembed>=0.8",
    "anthropic>=0.40",
    "openai>=1.50",
    "mcp>=1.30,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
]

[project.scripts]
tiendahogar-chat = "tiendahogar_agent.cli:principal"

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Los tests marcados integration (modelo real, red) se omiten por defecto;
# se ejecutan con: python -m pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: usa servicios reales (modelo de embeddings o API del LLM; descarga/red); omitido por defecto"]

[tool.ruff]
line-length = 100
extend-exclude = ["harness/context"]

[tool.setuptools.package-data]
tiendahogar_agent = ["plantillas/*.md"]
